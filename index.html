
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郭洧岑｜可愛電競像素風</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --navy: #10133b;
    --cyan: #65f3ff;
    --pink: #ff9de8;
    --purple: #ad83ff;
    --white: #f7f5ff;
}

body {
    min-height: 100vh;
    color: var(--white);
    font-family: "Microsoft JhengHei", sans-serif;
    background:
        radial-gradient(ellipse at 75% 35%, #29246b, transparent 42%),
        linear-gradient(145deg, #10153e, #090d24);
    overflow-x: hidden;
}

/* 像素網格背景 */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background-image:
        linear-gradient(#8d8cff 1px, transparent 1px),
        linear-gradient(90deg, #8d8cff 1px, transparent 1px);
    background-size: 24px 24px;
}

/* 頁首 */
header {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 6%;
    background: #11153de8;
    border-bottom: 3px solid var(--cyan);
}

.logo-icon {
    font-size: 2.3rem;
    filter: drop-shadow(0 0 8px var(--purple));
}

.logo {
    font-size: clamp(1.1rem, 3vw, 1.8rem);
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: var(--cyan);
}

/* 首頁版面 */
main {
    position: relative;
    min-height: 82vh;
    max-width: 1200px;
    margin: auto;
    padding: 65px 26px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: center;
    gap: 36px;
}

.eyebrow {
    color: var(--cyan);
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 0.85rem;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(3.4rem, 8vw, 6.5rem);
    line-height: 1.12;
    letter-spacing: 5px;
    text-shadow: 4px 4px 0 #5440b8;
}

h1 span {
    display: block;
    color: var(--pink);
    font-size: 0.52em;
    letter-spacing: 4px;
    margin-top: 14px;
    text-shadow: 3px 3px 0 #5e319a;
}

.desc {
    font-size: 1.1rem;
    line-height: 2;
    color: #d8ddff;
    margin: 24px 0 30px;
}

/* 可愛按鈕 */
.btn {
    display: inline-block;
    padding: 14px 22px;
    border: 2px solid var(--cyan);
    border-radius: 10px;
    background: linear-gradient(90deg, #4c8cff, #8d72ff);
    color: white;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 5px 5px 0 #171644;
    transition: 0.25s;
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 24px #65f3ff80;
}

/* 愛心裝飾 */
.hearts {
    color: var(--pink);
    font-size: 1.6rem;
    letter-spacing: 8px;
    margin-top: 26px;
    animation: twinkle 1.8s infinite alternate;
}

/* 遊戲視窗 */
.scene {
    position: relative;
    min-height: 390px;
    display: grid;
    place-items: center;
}

.glow {
    position: absolute;
    width: 78%;
    max-width: 340px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #7460ff30;
    filter: blur(35px);
}

.window {
    position: relative;
    width: min(100%, 390px);
    padding: 18px;
    background: linear-gradient(145deg, #25265f, #111735);
    border: 3px solid var(--purple);
    box-shadow: 8px 8px 0 #070b21;
    border-radius: 12px;
}

.window-top {
    display: flex;
    gap: 7px;
    padding-bottom: 14px;
    border-bottom: 1px solid #5555a2;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--pink);
}

.dot:nth-child(2) {
    background: #ffe58d;
}

.dot:nth-child(3) {
    background: var(--cyan);
}

/* Q版人物 */
.character {
    position: relative;
    margin: 24px auto 16px;
    width: 200px;
    height: 190px;
    display: grid;
    place-items: center;
}

.halo {
    position: absolute;
    width: 180px;
    height: 180px;
    border: 2px dashed #69eaff;
    border-radius: 50%;
    animation: spin 18s linear infinite;
}

.face {
    position: relative;
    width: 130px;
    height: 135px;
    background: #302750;
    border: 5px solid #0a102b;
    border-radius: 42% 42% 45% 45%;
    box-shadow: inset 0 -12px #e98cc6;
}

.hair {
    position: absolute;
    top: -10px;
    left: -8px;
    right: -8px;
    height: 55px;
    background: #272544;
    border: 5px solid #080d24;
    border-radius: 50% 50% 20% 20%;
    z-index: 2;
}

.hair::after {
    content: "";
    position: absolute;
    left: 35px;
    bottom: -18px;
    width: 35px;
    height: 45px;
    background: #272544;
    transform: rotate(18deg);
    border-left: 4px solid #080d24;
}

/* 耳機 */
.ear {
    position: absolute;
    top: 35px;
    width: 36px;
    height: 48px;
    border: 6px solid #11152d;
    border-radius: 12px;
    background: var(--purple);
    z-index: 3;
}

.ear.left {
    left: -30px;
}

.ear.right {
    right: -30px;
}

.ear::after {
    content: "♥";
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--cyan);
    font-size: 18px;
}

/* 眼睛 */
.eye {
    position: absolute;
    top: 62px;
    width: 15px;
    height: 22px;
    background: white;
    border-radius: 50%;
    z-index: 4;
}

.eye::after {
    content: "";
    display: block;
    width: 7px;
    height: 12px;
    background: #33336b;
    margin: 5px auto;
    border-radius: 50%;
}

.eye.left {
    left: 27px;
}

.eye.right {
    right: 27px;
}

/* 腮紅和嘴巴 */
.blush {
    position: absolute;
    top: 90px;
    width: 20px;
    height: 9px;
    background: #ff8fcb;
    border-radius: 50%;
    z-index: 4;
}

.blush.left {
    left: 10px;
}

.blush.right {
    right: 10px;
}

.mouth {
    position: absolute;
    z-index: 4;
    top: 96px;
    width: 18px;
    height: 12px;
    background: #ff8fc7;
    border: 3px solid #11152d;
    border-radius: 50%;
}

/* 筆電與貓咪 */
.laptop {
    position: relative;
    margin: -2px auto 0;
    width: 205px;
    height: 62px;
    background: #141e4a;
    border: 4px solid #090d22;
    border-radius: 8px 8px 3px 3px;
    display: grid;
    place-items: center;
    color: var(--cyan);
    font-size: 2rem;
    box-shadow: 0 6px 0 #7160dc;
}

.pet {
    position: absolute;
    right: 12px;
    bottom: 40px;
    font-size: 3rem;
    filter: drop-shadow(2px 3px 0 #090d22);
}

.caption {
    text-align: center;
    color: #cbd4ff;
    font-size: 0.8rem;
    letter-spacing: 2px;
    margin-top: 17px;
}

/* 星星 */
.spark {
    position: absolute;
    color: var(--pink);
    font-size: 1.5rem;
    animation: twinkle 1.3s infinite alternate;
}

.s1 {
    top: 24px;
    left: 20px;
}

.s2 {
    right: 20px;
    top: 70px;
    color: var(--cyan);
}

.s3 {
    bottom: 30px;
    left: 28px;
    color: #ffe58d;
}

/* 頁尾 */
footer {
    position: relative;
    text-align: center;
    padding: 20px;
    color: #b4bce8;
    border-top: 1px solid #47447e;
    font-size: 0.85rem;
}

footer span {
    color: var(--pink);
}

/* 動畫 */
@keyframes twinkle {
    from {
        opacity: 1;
        transform: scale(1);
    }
    to {
        opacity: 0.6;
        transform: scale(1.08);
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* 手機版 */
@media (max-width: 760px) {
    main {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 48px;
        gap: 20px;
    }

    .scene {
        min-height: 360px;
    }

    .desc {
        margin: 20px auto 26px;
    }

    h1 {
        letter-spacing: 2px;
    }

    .window {
        max-width: 340px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo-icon">🎮</div>
    <div class="logo">
        <span>郭洧岑</span>　個人網頁
    </div>
</header>

<main>

    <section class="intro">
        <p class="eyebrow">✦ PLAYER 01 · MY PIXEL WORLD ✦</p>

        <h1>
            郭洧岑
            <span>♡ GAME ON! ♡</span>
        </h1>

        <p class="desc">
            哈囉！歡迎來到我的小小遊戲世界！<br>
            喜歡電腦、遊戲與數位創作，<br>
            每天都要開心升級、收集新技能！ ✨
        </p>

        <a class="btn" href="#home">
            🎮　歡迎來到我的個人網頁　➜
        </a>

        <div class="hearts">♥ ♥ ♥</div>
    </section>

    <section class="scene" id="home">
        <div class="glow"></div>

        <div class="window">

            <div class="window-top">
                <i class="dot"></i>

            <div class="character">
                <div class="halo"></div>

                <div class="face">
                    <div class="hair"></div>

                    <div class="ear left"></div>

                    <div class="mouth"></div>

            </div>

            <div class="laptop">ฅ^•ﻌ•^ฅ</div>

            <p class="caption">

            </p>

        </div>
    </section>

</main>

<footer>
    © 2026 郭洧岑　<span>★</span>
    PIXEL GAMING WORLD　<span>♥</span>
</footer>

</body>
</html>
